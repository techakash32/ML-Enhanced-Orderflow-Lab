[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"






[project]
name = "crypto-orderflow-edge-lab"
version = "0.7.1"
requires-python = ">=3.11"
# no dependencies = [] here

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", ".venv*", "venv*", "env*", "build*", "dist*", "*.egg-info*",
           "htmlcov*", "docs*", "examples*", "notebooks*", "scripts*", "data*", "artifacts*"]