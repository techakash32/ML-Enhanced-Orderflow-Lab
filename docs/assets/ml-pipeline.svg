<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Machine-learning pipeline: record features, label with simulated live trades, purged walk-forward CV, LightGBM, holdout, champion promotion, live gate, drift monitor">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#121c3a"/></linearGradient>
</defs>
<rect width="1280" height="520" rx="16" fill="url(#bg)"/>
<text x="32" y="44" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f1f5f9">Machine-learning pipeline</text><text x="32" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">The model gates entries; it never places orders. Labels are outcomes of simulated live trades (exit parity).</text><rect x="32" y="110" width="224" height="92" rx="10" fill="#14243d" stroke="#3b82f6"/><text x="144.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dbeafe" text-anchor="middle">1  Record</text><text x="144" y="164" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">aggTrade + depth5</text><text x="144" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">1 snapshot / min / symbol</text><path d="M256 156 L280 156" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="280" y="110" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="392.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">2  Featurize</text><text x="392" y="164" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">OFI, VPIN, microprice,</text><text x="392" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">trade-size stats (causal)</text><path d="M504 156 L528 156" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="528" y="110" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="640.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">3  Label</text><text x="640" y="164" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">simulate_trade() with live</text><text x="640" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ATR trailing-stop rules</text><path d="M752 156 L776 156" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="776" y="110" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="888.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">4  Validate</text><text x="888" y="164" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Holdout (last 20%) +</text><text x="888" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">purged walk-forward CV</text><path d="M1000 156 L1024 156" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="1024" y="110" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="1136.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">5  Train</text><text x="1136" y="164" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">LightGBM, both sides</text><text x="1136" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">sign-flipped, one model</text><rect x="32" y="262" width="224" height="92" rx="10" fill="#0f2a2e" stroke="#14b8a6"/><text x="144.0" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="middle">6  Evaluate</text><text x="144" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">win rate vs breakeven,</text><text x="144" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">net R + block-bootstrap CI</text><path d="M256 308 L280 308" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="280" y="262" width="224" height="92" rx="10" fill="#0f2a2e" stroke="#14b8a6"/><text x="392.0" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="middle">7  Promote</text><text x="392" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">champion/challenger:</text><text x="392" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">>= 30 holdout trades</text><path d="M504 308 L528 308" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="528" y="262" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="640.0" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">8  Serve</text><text x="640" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">MLGate hot-reloads</text><text x="640" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">champion bundle</text><path d="M752 308 L776 308" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="776" y="262" width="224" height="92" rx="10" fill="#2b2110" stroke="#f59e0b"/><text x="888.0" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">9  Monitor</text><text x="888" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">PSI, prediction drift,</text><text x="888" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">firing rate, outcome drift</text><path d="M1000 308 L1024 308" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="1024" y="262" width="224" height="92" rx="10" fill="#1c1b3d" stroke="#6366f1"/><text x="1136.0" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">10  Retrain</text><text x="1136" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">weekly, same holdout</text><text x="1136" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">for both models</text><path d="M1144 202 L1144 232 L144 232 L144 262" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#arb)"/><rect x="32" y="414" width="1216" height="72" rx="12" fill="#2b2110" stroke="#f59e0b"/><text x="56" y="444" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fde68a">Honesty rules built into the pipeline</text><text x="56" y="468" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d6c58a">No lookahead (snapshots only read earlier events)  ·  purging by each trade’s exit time + embargo  ·  models refuse to load if exit rules differ  ·  too few trades = needs_more_data, no promotion</text></svg>